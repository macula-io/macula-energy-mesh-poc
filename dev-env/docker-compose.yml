# Development environment - infrastructure services only
# CortexIQ applications should be run locally with: cd system && mix phx.server

services:
  # Bondy WAMP Router
  bondy:
    image: leapsight/bondy:1.0.0-rc.44
    container_name: cortexiq_bondy
    user: "root" # Run as root to avoid permission issues (for dev only)
    ports:
      - "18080:18080" # API Gateway (HTTP + WebSocket WAMP)
      - "18081:18081" # Admin API
      - "18082:18082" # Raw TCP WAMP
      - "18083:18083" # TLS
    environment:
      - BONDY_ERL_NODENAME=bondy@bondy
      - BONDY_ERL_DISTRIBUTED_COOKIE=bondy
    volumes:
      - bondy_data:/bondy/data
      - bondy_log:/bondy/log
      - bondy_tmp:/bondy/tmp
      - ./bondy.conf:/bondy/etc/bondy.conf:ro
    networks:
      - cortexiq_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080/api/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Bondy Web Console
  bondy_console:
    image: leapsight/bondy-console:latest
    container_name: cortexiq_bondy_console
    ports:
      - "3000:8080" # Console web UI (nginx inside listens on 8080)
    environment:
      - BONDY_URL=http://localhost:18081
      # Console connects from browser, needs Admin API (18081) not API Gateway (18080)
    volumes:
      - ./console-config.json:/usr/share/nginx/html/config/settings.json:ro
    depends_on:
      - bondy
    networks:
      - cortexiq_network

  # PostgreSQL database for cortex_iq_dashboard
  timescale:
    image: timescale/timescaledb:latest-pg16
    container_name: cortexiq_timescale
    ports:
      - "5432:5432" # Expose for local development
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cortex_iq_dashboard_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cortexiq_network
    restart: unless-stopped

networks:
  cortexiq_network:
    driver: bridge

volumes:
  bondy_data:
  bondy_log:
  bondy_tmp:
  postgres_data:
