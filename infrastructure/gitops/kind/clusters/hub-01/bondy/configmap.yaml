apiVersion: v1
kind: ConfigMap
metadata:
  name: bondy-config
  namespace: macula-system
  labels:
    app: bondy
    app.kubernetes.io/name: bondy
    app.kubernetes.io/component: wamp-router
data:
  bondy.conf: |
    # Bondy Configuration for Energy Mesh PoC
    # Simple configuration enabling WebSocket WAMP

    # Security - Allow anonymous for application realms (temporary)
    security.allow_anonymous_user = on
    security.automatically_create_realms = off

    # WAMP over raw TCP
    wamp.tcp.enabled = on
    wamp.tcp.port = 18082
    wamp.tcp.acceptors_pool_size = 200
    wamp.tcp.max_connections = 100000

    # API Gateway (includes WebSocket WAMP)
    api_gateway.http.enabled = on
    api_gateway.http.port = 18080
    api_gateway.http.acceptors_pool_size = 200
    api_gateway.http.max_connections = 500000

    # WebSocket ping/pong to keep connections alive
    wamp.websocket.ping.enabled = on
    wamp.websocket.ping.idle_timeout = 30s
    wamp.websocket.ping.timeout = 10s
    wamp.websocket.ping.max_attempts = 3

    # WebSocket connection timeout
    wamp.websocket.idle_timeout = 300s
    wamp.websocket.max_frame_size = 1MB

    # WAMP call timeouts
    wamp.call_timeout = 30s
    wamp.max_call_timeout = 120s

    # Admin API
    admin_api.http.enabled = on
    admin_api.http.port = 18081

    # Logging
    log.console = console
    log.console.level = info

    # Node name (using pod name for uniqueness in K8s)
    nodename = bondy@127.0.0.1
    distributed_cookie = bondy

    # AAE
    aae.enabled = on

    # Store
    store.partitions = 16
    startup.wait_for_store_partitions = on
