apiVersion: v1
kind: ConfigMap
metadata:
  name: bondy-config
  namespace: macula-system
  labels:
    app: bondy
    app.kubernetes.io/name: bondy
    app.kubernetes.io/component: wamp-router
data:
  bondy.conf: |
    # Bondy Configuration for Energy Mesh PoC - 3-Node Cluster
    # Clustered configuration with Partisan for horizontal scaling

    # Security - Allow anonymous for application realms (temporary)
    security.allow_anonymous_user = on
    security.automatically_create_realms = off
    security.enabled = off  # Disable RBAC to allow all operations for PoC

    # WAMP over raw TCP
    wamp.tcp.enabled = on
    wamp.tcp.port = 18082
    wamp.tcp.acceptors_pool_size = 200
    wamp.tcp.max_connections = 100000

    # API Gateway (includes WebSocket WAMP)
    api_gateway.http.enabled = on
    api_gateway.http.port = 18080
    api_gateway.http.acceptors_pool_size = 200
    api_gateway.http.max_connections = 500000

    # WebSocket ping/pong to keep connections alive
    wamp.websocket.ping.enabled = on
    wamp.websocket.ping.idle_timeout = 30s
    wamp.websocket.ping.timeout = 10s
    wamp.websocket.ping.max_attempts = 3

    # WebSocket connection timeout
    wamp.websocket.idle_timeout = 300s
    wamp.websocket.max_frame_size = 1MB

    # WAMP call timeouts
    wamp.call_timeout = 30s
    wamp.max_call_timeout = 120s

    # Admin API
    admin_api.http.enabled = on
    admin_api.http.port = 18081

    # Logging
    log.console = console
    log.console.level = info

    # Clustering with Partisan
    # Node name will be set via BONDY_ERL_NODENAME env var
    # distributed_cookie will be set via BONDY_ERL_DISTRIBUTED_COOKIE env var

    # Cluster peer service
    cluster.peer_port = 18086
    cluster.parallelism = 4
    cluster.automatic_leave = off

    # Kubernetes DNS-based peer discovery
    # Pods will autodiscover via headless service
    cluster.peer_discovery.enabled = on
    cluster.peer_discovery.type = dns
    cluster.peer_discovery.polling_interval = 10s

    # DNS discovery configuration
    # This will resolve bondy-headless.macula-system.svc.cluster.local to all pod IPs
    cluster.peer_discovery.config.query = bondy-headless.macula-system.svc.cluster.local
    cluster.peer_discovery.config.node_basename = bondy
    cluster.peer_discovery.config.record_type = a

    # AAE (Active Anti-Entropy) for data consistency across cluster
    aae.enabled = on
    aae.exchange_timer = 60s
    aae.hashtree_timer = 30s

    # Store
    store.partitions = 16
    startup.wait_for_store_partitions = on
    startup.wait_for_store_hashtrees = on
