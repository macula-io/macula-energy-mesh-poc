---
apiVersion: v1
kind: ConfigMap
metadata:
  name: create-realm-script
  namespace: macula-platform
  labels:
    app: bondy
data:
  create-realm.sh: |
    #!/bin/sh
    set -e

    # Wait for Bondy to be ready
    echo "Waiting for Bondy to be ready..."
    until curl -s http://bondy:18080/ > /dev/null 2>&1; do
      echo "Bondy not ready yet, waiting..."
      sleep 2
    done
    echo "✓ Bondy is ready"

    # Load credentials from secrets
    ADMIN_USER="${ADMIN_USERNAME}"
    ADMIN_PASS="${ADMIN_PASSWORD}"
    CONSOLE_USER="${CONSOLE_USERNAME}"
    CONSOLE_PASS="${CONSOLE_PASSWORD}"
    APP_USER="${APP_USERNAME}"
    APP_PASS="${APP_PASSWORD}"
    MASTER_REALM="${MASTER_REALM}"
    APP_REALM="${APP_REALM}"

    BONDY_API="http://bondy:18081"

    echo "========================================="
    echo "Bondy Security Bootstrap"
    echo "========================================="

    # Create master realm (com.leapsight.bondy)
    echo "Creating master realm: $MASTER_REALM"
    curl -s -X POST "$BONDY_API/realms" \
      -H "Content-Type: application/json" \
      -d "{
        \"uri\": \"$MASTER_REALM\",
        \"description\": \"Bondy Master Realm\",
        \"authmethods\": [\"wampcra\", \"trust\"],
        \"security_enabled\": true
      }" && echo "✓ Master realm created" || echo "Master realm already exists"

    # Create application realm (be.cortexiq.energy)
    echo "Creating application realm: $APP_REALM"
    curl -s -X POST "$BONDY_API/realms" \
      -H "Content-Type: application/json" \
      -d "{
        \"uri\": \"$APP_REALM\",
        \"description\": \"CortexIQ Energy Trading Application\",
        \"authmethods\": [\"wampcra\", \"trust\"],
        \"security_enabled\": true,
        \"allow_connections\": true
      }" && echo "✓ Application realm created" || echo "Application realm already exists"

    sleep 2

    # Create admin user in master realm
    echo "Creating admin user: $ADMIN_USER"
    curl -s -X POST "$BONDY_API/realms/$MASTER_REALM/users" \
      -H "Content-Type: application/json" \
      -d "{
        \"username\": \"$ADMIN_USER\",
        \"password\": \"$ADMIN_PASS\",
        \"groups\": [\"bondy.administrators\"]
      }" && echo "✓ Admin user created" || echo "Admin user already exists"

    # Create console user in master realm
    echo "Creating console user: $CONSOLE_USER"
    curl -s -X POST "$BONDY_API/realms/$MASTER_REALM/users" \
      -H "Content-Type: application/json" \
      -d "{
        \"username\": \"$CONSOLE_USER\",
        \"password\": \"$CONSOLE_PASS\",
        \"groups\": [\"bondy.administrators\"]
      }" && echo "✓ Console user created" || echo "Console user already exists"

    # Create application user in app realm
    echo "Creating application user: $APP_USER"
    curl -s -X POST "$BONDY_API/realms/$APP_REALM/users" \
      -H "Content-Type: application/json" \
      -d "{
        \"username\": \"$APP_USER\",
        \"password\": \"$APP_PASS\",
        \"groups\": []
      }" && echo "✓ Application user created" || echo "Application user already exists"

    # Grant permissions to application user
    echo "Granting permissions to application user..."
    curl -s -X POST "$BONDY_API/realms/$APP_REALM/grants" \
      -H "Content-Type: application/json" \
      -d "{
        \"roles\": [\"$APP_USER\"],
        \"permissions\": [\"wamp.subscribe\", \"wamp.unsubscribe\", \"wamp.publish\", \"wamp.call\", \"wamp.cancel\", \"wamp.register\", \"wamp.unregister\"],
        \"resources\": [
          {
            \"uri\": \"*\",
            \"match\": \"wildcard\"
          }
        ]
      }" && echo "✓ Permissions granted" || echo "Permissions already exist"

    echo "========================================="
    echo "✓ Bondy security configured successfully!"
    echo "========================================="
    echo ""
    echo "Credentials:"
    echo "  Admin: $ADMIN_USER / $ADMIN_PASS"
    echo "  Console: $CONSOLE_USER / $CONSOLE_PASS"
    echo "  App: $APP_USER / $APP_PASS"

---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-cortexiq-realm
  namespace: macula-platform
  labels:
    app: bondy
    job: create-realm
spec:
  template:
    metadata:
      labels:
        app: bondy
        job: create-realm
    spec:
      restartPolicy: OnFailure
      containers:
      - name: create-realm
        image: curlimages/curl:latest
        command: ["/bin/sh", "/scripts/create-realm.sh"]
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        env:
        - name: ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: bondy-credentials
              key: admin-username
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bondy-credentials
              key: admin-password
        - name: CONSOLE_USERNAME
          valueFrom:
            secretKeyRef:
              name: bondy-credentials
              key: console-username
        - name: CONSOLE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bondy-credentials
              key: console-password
        - name: APP_USERNAME
          valueFrom:
            secretKeyRef:
              name: bondy-credentials
              key: app-username
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bondy-credentials
              key: app-password
        - name: MASTER_REALM
          valueFrom:
            secretKeyRef:
              name: bondy-credentials
              key: master-realm
        - name: APP_REALM
          valueFrom:
            secretKeyRef:
              name: bondy-credentials
              key: app-realm
      volumes:
      - name: scripts
        configMap:
          name: create-realm-script
          defaultMode: 0755
