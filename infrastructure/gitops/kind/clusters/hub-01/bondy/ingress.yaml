---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bondy
  namespace: macula-system
  labels:
    app: bondy
    app.kubernetes.io/name: bondy
    app.kubernetes.io/component: wamp-router
  annotations:
    # WebSocket support for WAMP connections
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: bondy
spec:
  ingressClassName: nginx
  rules:
    - host: hub.macula.local
      http:
        paths:
          # WebSocket/WAMP on root path (no rewrite)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bondy
                port:
                  number: 18080
