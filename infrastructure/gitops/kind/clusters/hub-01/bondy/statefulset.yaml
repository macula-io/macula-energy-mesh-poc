apiVersion: v1
kind: Service
metadata:
  name: bondy-headless
  namespace: macula-system
  labels:
    app: bondy
    app.kubernetes.io/name: bondy
    app.kubernetes.io/component: wamp-router
spec:
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app: bondy
  ports:
  - name: http-ws
    protocol: TCP
    port: 18080
    targetPort: 18080
  - name: admin-api
    protocol: TCP
    port: 18081
    targetPort: 18081
  - name: cluster
    protocol: TCP
    port: 18086
    targetPort: 18086
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bondy
  namespace: macula-system
  labels:
    app: bondy
    app.kubernetes.io/name: bondy
    app.kubernetes.io/component: wamp-router
    app.kubernetes.io/part-of: macula-system
spec:
  replicas: 3
  serviceName: bondy-headless
  podManagementPolicy: Parallel  # Start all pods at once
  selector:
    matchLabels:
      app: bondy
  template:
    metadata:
      labels:
        app: bondy
        app.kubernetes.io/name: bondy
        app.kubernetes.io/component: wamp-router
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: bondy
        image: leapsight/bondy:1.0.0-rc.47
        imagePullPolicy: IfNotPresent
        ports:
        - name: http-ws
          containerPort: 18080
          protocol: TCP
        - name: admin-api
          containerPort: 18081
          protocol: TCP
        - name: https-wss
          containerPort: 18083
          protocol: TCP
        - name: cluster
          containerPort: 18086
          protocol: TCP
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: BONDY_ERL_NODENAME
          value: "bondy@$(POD_IP)"
        - name: BONDY_ERL_DISTRIBUTED_COOKIE
          value: "bondy-cluster-secret"
        - name: BONDY_LOG_CONSOLE
          value: "console"
        - name: BONDY_LOG_LEVEL
          value: "info"
        - name: RELX_REPLACE_OS_VARS
          value: "true"
        volumeMounts:
        - name: config
          mountPath: /bondy/etc/bondy.conf
          subPath: bondy.conf
        - name: data
          mountPath: /bondy/data
        resources:
          requests:
            memory: "3Gi"
            cpu: "1500m"
          limits:
            memory: "6Gi"
            cpu: "3000m"
        readinessProbe:
          httpGet:
            path: /ping
            port: 18081
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /ping
            port: 18081
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
      volumes:
      - name: config
        configMap:
          name: bondy-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
