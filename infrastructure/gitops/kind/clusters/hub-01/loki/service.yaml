apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring
  labels:
    app: loki
    component: logging
spec:
  type: NodePort
  selector:
    app: loki
  ports:
  - name: http
    port: 3100
    targetPort: http
    nodePort: 30100
    protocol: TCP
  - name: grpc
    port: 9096
    targetPort: grpc
    protocol: TCP
