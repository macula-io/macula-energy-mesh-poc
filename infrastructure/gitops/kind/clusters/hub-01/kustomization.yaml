apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Namespace definitions
  - macula-hub-namespace.yaml

  # macula-system namespace: Bondy infrastructure
  - bondy
  - portal

  # macula-hub namespace: Hub applications and storage
  - macula-hub-secrets.yaml  # Shared secrets for macula-hub namespace
  - cortex-iq-simulation  # Simulation clock infrastructure
  - cortex-iq-dashboard   # CortexIQ Dashboard (Phoenix LiveView UI)
  - cortex-iq-projections # CQRS write-side projections (WAMP events → PostgreSQL)
  - cortex-iq-queries     # CQRS read-side queries (PostgreSQL/TimescaleDB → WAMP RPC)

  # Monitoring (macula-system namespace)
  - prometheus
  - grafana
  - loki
  - fluent-bit

  # Infrastructure
  - metallb  # MetalLB for LoadBalancer support in KinD
  - external-dns  # ExternalDNS with PowerDNS for dynamic DNS management

# Namespace Structure:
# - macula-system: Bondy, monitoring, infrastructure
# - macula-hub: Dashboards, projections, queries, simulation, postgres
