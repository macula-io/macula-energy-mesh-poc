apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        component: monitoring
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.2.2
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # Security: disable anonymous access
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            # Default admin credentials (CHANGE IN PRODUCTION!)
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "macula123"
            # Disable user signup
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            # Server settings
            - name: GF_SERVER_ROOT_URL
              value: "http://analytics.macula.local:8080"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "false"
            - name: GF_SERVER_DOMAIN
              value: "analytics.macula.local"
            # Dashboard provisioning
            - name: GF_PATHS_PROVISIONING
              value: "/etc/grafana/provisioning"
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-config
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-macula
              mountPath: /var/lib/grafana/dashboards/macula-system.json
              subPath: macula-system.json
            - name: dashboard-cortexiq
              mountPath: /var/lib/grafana/dashboards/cortexiq-energy.json
              subPath: cortexiq-energy.json
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: grafana-storage
          emptyDir: {}
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-config
          configMap:
            name: grafana-dashboards-config
        - name: dashboard-macula
          configMap:
            name: grafana-dashboard-macula
        - name: dashboard-cortexiq
          configMap:
            name: grafana-dashboard-cortexiq
