apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-macula
  namespace: monitoring
data:
  macula-platform.json: |
    {
      "dashboard": {
        "title": "Macula Platform Overview",
        "uid": "macula-platform",
        "tags": ["macula", "platform"],
        "timezone": "browser",
        "schemaVersion": 16,
        "version": 0,
        "refresh": "5s",
        "panels": [
          {
            "id": 1,
            "title": "Total Pods",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
            "targets": [
              {
                "expr": "count(kube_pod_info{namespace=\"macula-system\"})",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "orientation": "auto",
              "reduceOptions": {
                "values": false,
                "calcs": ["lastNotNull"]
              }
            }
          },
          {
            "id": 2,
            "title": "MaculaOs Sidecars Running",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
            "targets": [
              {
                "expr": "count(kube_pod_container_info{namespace=\"macula-system\", container=\"macula-os\"})",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "orientation": "auto",
              "reduceOptions": {
                "values": false,
                "calcs": ["lastNotNull"]
              }
            }
          },
          {
            "id": 3,
            "title": "CPU Usage by Container",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
            "targets": [
              {
                "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"macula-system\"}[5m])) by (container)",
                "refId": "A",
                "legendFormat": "{{container}}"
              }
            ]
          },
          {
            "id": 4,
            "title": "Memory Usage by Container",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
            "targets": [
              {
                "expr": "sum(container_memory_working_set_bytes{namespace=\"macula-system\"}) by (container)",
                "refId": "A",
                "legendFormat": "{{container}}"
              }
            ]
          },
          {
            "id": 5,
            "title": "Pod Restarts",
            "type": "table",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
            "targets": [
              {
                "expr": "kube_pod_container_status_restarts_total{namespace=\"macula-system\"}",
                "refId": "A",
                "format": "table"
              }
            ]
          },
          {
            "id": 6,
            "title": "Network Traffic",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
            "targets": [
              {
                "expr": "sum(rate(container_network_receive_bytes_total{namespace=\"macula-system\"}[5m])) by (pod)",
                "refId": "A",
                "legendFormat": "RX {{pod}}"
              },
              {
                "expr": "sum(rate(container_network_transmit_bytes_total{namespace=\"macula-system\"}[5m])) by (pod)",
                "refId": "B",
                "legendFormat": "TX {{pod}}"
              }
            ]
          }
        ]
      }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cortexiq
  namespace: monitoring
data:
  cortexiq-energy.json: |
    {
      "dashboard": {
        "title": "CortexIQ Energy Mesh",
        "uid": "cortexiq-energy",
        "tags": ["cortexiq", "energy"],
        "timezone": "browser",
        "schemaVersion": 16,
        "version": 0,
        "refresh": "5s",
        "panels": [
          {
            "id": 1,
            "title": "Home Bots Active",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
            "targets": [
              {
                "expr": "count(kube_pod_container_info{namespace=\"macula-system\", app=\"cortex-iq-homes\"})",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "orientation": "auto",
              "reduceOptions": {
                "values": false,
                "calcs": ["lastNotNull"]
              }
            }
          },
          {
            "id": 2,
            "title": "Provider Bots Active",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
            "targets": [
              {
                "expr": "count(kube_pod_container_info{namespace=\"macula-system\", app=\"cortex-iq-utilities\"})",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "orientation": "auto",
              "reduceOptions": {
                "values": false,
                "calcs": ["lastNotNull"]
              }
            }
          },
          {
            "id": 3,
            "title": "Dashboard Health",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
            "targets": [
              {
                "expr": "count(kube_pod_container_info{namespace=\"macula-system\", app=\"cortex-iq-dashboard\"})",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "orientation": "auto",
              "reduceOptions": {
                "values": false,
                "calcs": ["lastNotNull"]
              }
            }
          },
          {
            "id": 4,
            "title": "Homes CPU Usage",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
            "targets": [
              {
                "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"macula-system\", app=\"cortex-iq-homes\"}[5m])) by (pod)",
                "refId": "A",
                "legendFormat": "{{pod}}"
              }
            ]
          },
          {
            "id": 5,
            "title": "Homes Memory Usage",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
            "targets": [
              {
                "expr": "sum(container_memory_working_set_bytes{namespace=\"macula-system\", app=\"cortex-iq-homes\"}) by (pod)",
                "refId": "A",
                "legendFormat": "{{pod}}"
              }
            ]
          },
          {
            "id": 6,
            "title": "MaculaOs Sidecar Resource Usage",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 12},
            "targets": [
              {
                "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"macula-system\", container=\"macula-os\"}[5m])) by (pod)",
                "refId": "A",
                "legendFormat": "CPU {{pod}}"
              },
              {
                "expr": "sum(container_memory_working_set_bytes{namespace=\"macula-system\", container=\"macula-os\"}) by (pod) / 1024 / 1024",
                "refId": "B",
                "legendFormat": "Memory MB {{pod}}"
              }
            ]
          }
        ]
      }
    }
