---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bondy-console
  namespace: macula-system
  labels:
    app: bondy-console
    app.kubernetes.io/name: bondy-console
    app.kubernetes.io/component: web-console
  annotations:
    nginx.ingress.kubernetes.io/websocket-services: "bondy-console"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: console.macula.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bondy-console
                port:
                  number: 8080
