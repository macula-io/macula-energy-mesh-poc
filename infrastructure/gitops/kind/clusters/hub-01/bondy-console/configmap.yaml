---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bondy-console-config
  namespace: macula-platform
  labels:
    app: bondy-console
    app.kubernetes.io/name: bondy-console
    app.kubernetes.io/component: web-console
data:
  settings.json: |
    {
      "bondyUrl": "ws://hub.macula.local/ws",
      "bondyHttpUrl": "http://hub.macula.local/admin",
      "userKeysMax": 10,
      "keyMaxCharacters": 256
    }
