apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal
  namespace: macula-platform
  labels:
    app: portal
spec:
  ingressClassName: nginx
  rules:
  - host: portal.macula.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portal
            port:
              number: 80
