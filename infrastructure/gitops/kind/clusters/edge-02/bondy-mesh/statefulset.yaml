apiVersion: v1
kind: Service
metadata:
  name: bondy-headless
  namespace: macula-edge
  labels:
    app: bondy-mesh
spec:
  clusterIP: None
  selector:
    app: bondy-mesh
  ports:
  - name: http-ws
    port: 18080
    targetPort: 18080
  - name: admin-api
    port: 18081
    targetPort: 18081
  - name: cluster
    port: 18086
    targetPort: 18086
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bondy-mesh
  namespace: macula-edge
  labels:
    app: bondy-mesh
    app.kubernetes.io/name: bondy-mesh
    app.kubernetes.io/component: wamp-router
spec:
  replicas: 1
  serviceName: bondy-headless
  selector:
    matchLabels:
      app: bondy-mesh
  template:
    metadata:
      labels:
        app: bondy-mesh
        cluster: macula-edge-01
    spec:
      containers:
      - name: bondy
        image: leapsight/bondy:1.0.0-rc.47
        imagePullPolicy: IfNotPresent
        ports:
        - name: http-ws
          containerPort: 18080
          protocol: TCP
        - name: admin-api
          containerPort: 18081
          protocol: TCP
        - name: cluster
          containerPort: 18086
          protocol: TCP
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: BONDY_ERL_NODENAME
          value: "bondy@$(POD_IP)"
        - name: BONDY_ERL_DISTRIBUTED_COOKIE
          value: "bondy-cluster-secret"
        - name: BONDY_LOG_CONSOLE
          value: "console"
        - name: BONDY_LOG_LEVEL
          value: "info"
        - name: RELX_REPLACE_OS_VARS
          value: "true"
        volumeMounts:
        - name: config
          mountPath: /bondy/etc/bondy.conf
          subPath: bondy.conf
        - name: data
          mountPath: /bondy/data
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1500m"
            memory: "3Gi"
        readinessProbe:
          httpGet:
            path: /ping
            port: 18081
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /ping
            port: 18081
          initialDelaySeconds: 60
          periodSeconds: 30
      volumes:
      - name: config
        configMap:
          name: bondy-mesh-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
