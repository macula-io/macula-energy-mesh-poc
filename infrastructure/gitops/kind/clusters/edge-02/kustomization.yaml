apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Edge-02: 13 Homes

resources:
  - namespace.yaml
  - ../../base/cortex-iq-homes

patches:
  - target:
      kind: Deployment
      name: cortex-iq-homes
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "13"
