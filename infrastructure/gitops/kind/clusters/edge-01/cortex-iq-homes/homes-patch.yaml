apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-iq-homes
  namespace: macula-edge
spec:
  replicas: 2
  template:
    spec:
      containers:
      - name: homes
        env:
        - name: BONDY_URL
          valueFrom:
            configMapKeyRef:
              name: bondy-client-config
              key: BONDY_URL
        - name: BONDY_REALM
          valueFrom:
            configMapKeyRef:
              name: bondy-client-config
              key: BONDY_REALM
        - name: HOMES_SOURCES
          value: "brussels_homes_chunk_01.json,brussels_homes_chunk_02.json,brussels_homes_chunk_03.json,flanders_central_homes_chunk_01.json,flanders_central_homes_chunk_02.json,flanders_central_homes_chunk_03.json,flanders_east_homes_chunk_01.json,flanders_east_homes_chunk_02.json,flanders_east_homes_chunk_03.json,flanders_west_homes_chunk_01.json,flanders_west_homes_chunk_02.json,flanders_west_homes_chunk_03.json,wallonia_north_homes_chunk_01.json,wallonia_north_homes_chunk_02.json,wallonia_north_homes_chunk_03.json,wallonia_south_homes_chunk_01.json,wallonia_south_homes_chunk_02.json,wallonia_south_homes_chunk_03.json,netherlands_central_homes_chunk_01.json,netherlands_central_homes_chunk_02.json,netherlands_central_homes_chunk_03.json,netherlands_east_homes_chunk_01.json,netherlands_east_homes_chunk_02.json,netherlands_east_homes_chunk_03.json,netherlands_north_homes_chunk_01.json,netherlands_north_homes_chunk_02.json,netherlands_north_homes_chunk_03.json,netherlands_south_homes_chunk_01.json,netherlands_south_homes_chunk_02.json,netherlands_south_homes_chunk_03.json,netherlands_west_homes_chunk_01.json,netherlands_west_homes_chunk_02.json,netherlands_west_homes_chunk_03.json"
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "8Gi"
            cpu: "2000m"
