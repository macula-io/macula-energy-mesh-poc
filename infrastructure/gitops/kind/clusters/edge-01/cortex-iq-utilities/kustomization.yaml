apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/cortex-iq-utilities

namespace: macula-apps

# Patch to use local edge Bondy instead of hub
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/4/value
        value: "ws://bondy-edge.macula-platform.svc.cluster.local:18080/ws"
    target:
      kind: Deployment
      name: cortex-iq-utilities
