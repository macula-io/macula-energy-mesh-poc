apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: macula-edge-01-pool
  namespace: metallb-system
spec:
  addresses:
  - 172.20.255.30-172.20.255.49  # Edge-01: .30-.49
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: macula-edge-01-l2
  namespace: metallb-system
spec:
  ipAddressPools:
  - macula-edge-01-pool
