apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/cortex-iq-homes

namespace: macula-edge

# Patch to use Wallonia North homes (40 homes)
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "wallonia_north_homes.json"
    target:
      kind: Deployment
      name: cortex-iq-homes
