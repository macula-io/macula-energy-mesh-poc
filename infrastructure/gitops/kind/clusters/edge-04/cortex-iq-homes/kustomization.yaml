apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/cortex-iq-homes

namespace: macula-edge

# Patch to use specific home data file (connects to hub Bondy by default)
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "flanders_edge_04_homes.json"
    target:
      kind: Deployment
      name: cortex-iq-homes
