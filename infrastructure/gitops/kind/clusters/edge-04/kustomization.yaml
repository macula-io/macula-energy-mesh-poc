apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Edge-04: Homes with even IDs (2, 4, 6, 8, ... 50)

resources:
  - namespace.yaml
  - ../../base/cortex-iq-homes

patches:
  - target:
      kind: Deployment
      name: cortex-iq-homes
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "even"
