apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Edge-04: 50 Flanders homes (persistent UUID7 IDs)

resources:
  - metallb
  - external-dns
  - namespace.yaml
  - ../../base/cortex-iq-homes

patches:
  - target:
      kind: Deployment
      name: cortex-iq-homes
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "flanders_edge_04_homes.json"
