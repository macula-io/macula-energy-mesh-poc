---
apiVersion: v1
kind: ConfigMap
metadata:
  name: create-realm-script
  namespace: macula-hub
  labels:
    app: bondy
data:
  create-realm.sh: |
    #!/bin/sh
    # Wait for Bondy to be ready
    echo "Waiting for Bondy to be ready..."
    until curl -s http://bondy:18080/ > /dev/null 2>&1; do
      echo "Bondy not ready yet, waiting..."
      sleep 2
    done

    echo "Bondy is ready, creating realm..."

    # Create the realm via Bondy Admin API (port 18081)
    # Full realm configuration for demo (proper values for Console display)
    curl -X POST http://bondy:18081/realms \
      -H "Content-Type: application/json" \
      -d '{
        "uri": "be.cortexiq.energy",
        "description": "CortexIQ Energy Trading Demo Realm",
        "is_prototype": false,
        "is_sso_realm": false,
        "allow_connections": true,
        "authmethods": ["anonymous"]
      }' && echo "Realm created successfully" || echo "Realm creation failed - may already exist"

    echo "Disabling security for demo..."
    # Security must be disabled via separate endpoint
    curl -X POST http://bondy:18081/realms/be.cortexiq.energy/security/disable && \
      echo "Security disabled successfully" || echo "Security disable failed"

    echo "Realm setup complete"

---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-cortexiq-realm
  namespace: macula-hub
  labels:
    app: bondy
    job: create-realm
spec:
  template:
    metadata:
      labels:
        app: bondy
        job: create-realm
    spec:
      restartPolicy: OnFailure
      containers:
      - name: create-realm
        image: curlimages/curl:latest
        command: ["/bin/sh", "/scripts/create-realm.sh"]
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: create-realm-script
          defaultMode: 0755
