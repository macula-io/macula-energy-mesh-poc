---
apiVersion: v1
kind: ConfigMap
metadata:
  name: create-realm-script
  namespace: macula-hub
  labels:
    app: bondy
data:
  create-realm.sh: |
    #!/bin/sh
    # Wait for Bondy to be ready
    echo "Waiting for Bondy to be ready..."
    until curl -s http://bondy:18080/ > /dev/null 2>&1; do
      echo "Bondy not ready yet, waiting..."
      sleep 2
    done

    echo "Bondy is ready, ensuring clean realm setup..."

    # Delete realm if it exists (auto-created by Bondy when clients connect)
    echo "Deleting existing realm (if any)..."
    /bondy/bin/bondy eval 'bondy_realm:delete(<<"be.cortexiq.energy">>).' || echo "No existing realm to delete"
    sleep 1

    # Create the realm via Bondy Admin API (port 18081)
    # Full realm configuration for demo (proper values for Console display)
    echo "Creating realm with proper configuration..."
    curl -X POST http://bondy:18081/realms \
      -H "Content-Type: application/json" \
      -d '{
        "uri": "be.cortexiq.energy",
        "description": "CortexIQ Energy Trading Demo Realm",
        "is_prototype": false,
        "is_sso_realm": false,
        "allow_connections": true,
        "authmethods": ["anonymous"]
      }' && echo "Realm created successfully" || echo "Realm creation failed"

    echo "Disabling security for demo..."
    # Security must be disabled via bondy RPC (HTTP endpoint doesn't exist)
    # Wait a bit for realm to be fully initialized
    sleep 2
    /bondy/bin/bondy eval 'bondy_realm:disable_security(<<"be.cortexiq.energy">>).' && \
      echo "Security disabled successfully" || echo "Security disable failed"

    echo "Realm setup complete"

---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-cortexiq-realm
  namespace: macula-hub
  labels:
    app: bondy
    job: create-realm
spec:
  template:
    metadata:
      labels:
        app: bondy
        job: create-realm
    spec:
      restartPolicy: OnFailure
      containers:
      - name: create-realm
        image: leapsight/bondy:1.0.0-rc.44
        command: ["/bin/sh", "/scripts/create-realm.sh"]
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        env:
        - name: BONDY_NODE_NAME
          value: "bondy@bondy.macula-hub.svc.cluster.local"
      volumes:
      - name: scripts
        configMap:
          name: create-realm-script
          defaultMode: 0755
