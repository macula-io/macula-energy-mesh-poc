---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-config
  namespace: macula-hub
data:
  # pgAdmin default credentials
  PGADMIN_DEFAULT_EMAIL: admin@macula.io
  PGADMIN_DEFAULT_PASSWORD: admin
  PGADMIN_CONFIG_SERVER_MODE: "False"
  PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-servers
  namespace: macula-hub
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "CortexIQ Dashboard",
          "Group": "Macula Platform",
          "Host": "postgres.macula-hub.svc.cluster.local",
          "Port": 5432,
          "MaintenanceDB": "cortexiq_dashboard",
          "Username": "cortexiq",
          "SSLMode": "prefer",
          "PassFile": "/pgpass"
        }
      }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-pgpass
  namespace: macula-hub
data:
  pgpass: |
    postgres.macula-hub.svc.cluster.local:5432:cortexiq_dashboard:cortexiq:cortexiq123
