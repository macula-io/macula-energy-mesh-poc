apiVersion: v1
kind: ConfigMap
metadata:
  name: bondy-client-config
  namespace: macula-edge
  labels:
    app.kubernetes.io/name: bondy-client-config
    app.kubernetes.io/part-of: macula-system
data:
  # Bondy WAMP Router connection settings
  # Connect to LOCAL bondy-mesh in same namespace (edge+beam distributed mesh)
  # Each edge cluster has its own bondy-mesh-0 StatefulSet with "bondy" service
  BONDY_URL: "ws://bondy-mesh-0.bondy.macula-edge.svc.cluster.local:18080/ws"
  BONDY_REALM: "be.cortexiq.energy"

  # Alternative URLs (for reference):
  # - Simplified (same namespace): ws://bondy-mesh-0.bondy:18080/ws
  # - Via service directly: ws://bondy.macula-edge.svc.cluster.local:18080/ws
  # - Hub cluster (old): ws://hub.macula.local/ws
