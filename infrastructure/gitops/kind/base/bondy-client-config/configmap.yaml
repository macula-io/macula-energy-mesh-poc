apiVersion: v1
kind: ConfigMap
metadata:
  name: bondy-client-config
  namespace: macula-edge
  labels:
    app.kubernetes.io/name: bondy-client-config
    app.kubernetes.io/part-of: macula-system
data:
  # Bondy WAMP Router connection settings
  # Use DNS name via ingress (proper solution, no hardcoded IPs)
  # DNS resolution provided by /etc/hosts or PowerDNS
  # Ingress forwards port 80 to Bondy service port 18080
  BONDY_URL: "ws://hub.macula.local/ws"
  BONDY_REALM: "be.cortexiq.energy"

  # Alternative URLs (for reference):
  # - Via NodePort (not recommended): ws://172.20.0.7:30080/ws
  # - Via LoadBalancer IP: ws://172.20.255.10/ws
  # - Internal (hub cluster only): ws://bondy.macula-system.svc.cluster.local:18080/ws
