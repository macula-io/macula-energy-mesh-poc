apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-iq-homes
  namespace: macula-edge
  labels:
    app: cortex-iq-homes
    app.kubernetes.io/name: cortex-iq-homes
    app.kubernetes.io/component: payload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cortex-iq-homes
  template:
    metadata:
      labels:
        app: cortex-iq-homes
        app.kubernetes.io/name: cortex-iq-homes
        app.kubernetes.io/component: payload
    spec:
      containers:
      - name: homes
        image: registry.macula.local:5000/macula/cortex-iq-homes:latest
        imagePullPolicy: Always
        env:
        - name: BONDY_URL
          valueFrom:
            configMapKeyRef:
              name: bondy-client-config
              key: BONDY_URL
        - name: BONDY_REALM
          valueFrom:
            configMapKeyRef:
              name: bondy-client-config
              key: BONDY_REALM
        - name: HOMES_SOURCE
          value: "flanders_test_homes.json"  # Default: 10 homes for testing
        resources:
          requests:
            memory: "1Gi"
            cpu: "250m"
          limits:
            memory: "4Gi"
            cpu: "1000m"
