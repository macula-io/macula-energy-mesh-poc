apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
  labels:
    app.kubernetes.io/name: external-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.14.2
          args:
            # Sources: watch Services and Ingresses for DNS records
            - --source=service
            - --source=ingress

            # Provider: PowerDNS with HTTP API
            - --provider=pdns

            # PowerDNS API endpoint (will be overridden in overlays with actual host IP)
            - --pdns-server=http://HOST_IP:8081

            # Domain filtering (will be overridden per cluster)
            - --domain-filter=macula.local

            # Synchronization policy
            - --policy=sync

            # TXT registry for ownership tracking
            - --registry=txt
            - --txt-owner-id=CLUSTER_ID
            - --txt-prefix=external-dns-

            # Logging
            - --log-level=info
            - --log-format=text

            # Interval for checking DNS records
            - --interval=1m
          env:
            # PowerDNS API Key (from Secret)
            - name: EXTERNAL_DNS_PDNS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: external-dns-pdns
                  key: api-key
