apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
  labels:
    app.kubernetes.io/name: external-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: k8s.gcr.io/external-dns/external-dns:v0.14.2
          args:
            - --source=service
            - --source=ingress
            - --provider=coredns
            - --coredns-proxy=http://coredns-service.coredns.svc.cluster.local:53 # example service in cluster
            - --domain-filter=your.domain.local # restrict to your local domains
            - --policy=sync
            - --registry=txt
            - --txt-owner-id=cluster-1
            - --log-level=info
