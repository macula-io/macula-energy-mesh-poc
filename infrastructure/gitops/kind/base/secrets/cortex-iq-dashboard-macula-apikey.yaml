apiVersion: v1
kind: Secret
metadata:
  name: cortex-iq-dashboard-macula-apikey
  namespace: macula-apps
  labels:
    app.kubernetes.io/name: cortex-iq-dashboard
    app.kubernetes.io/component: api-key
type: Opaque
stringData:
  # API key format: org-app-uuid
  # MaculaOs derives namespace as "org.app" from this format
  key: "cortexiq-dashboard-12345678-1234-1234-1234-123456789012"
  namespace: "cortexiq.dashboard"
