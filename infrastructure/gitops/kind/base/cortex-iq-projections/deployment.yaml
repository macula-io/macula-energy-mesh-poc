apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-iq-projections
  namespace: macula-hub
  labels:
    app: cortex-iq-projections
    component: projections
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cortex-iq-projections
  template:
    metadata:
      labels:
        app: cortex-iq-projections
        component: projections
        tier: backend
    spec:
      containers:
      - name: projections
        image: registry.macula.local:5000/macula/cortex-iq-projections:latest
        imagePullPolicy: Always
        env:
        # BEAM VM Memory Limits
        - name: ERL_FLAGS
          value: "+MBas aobf +MHas aobf +sbwt none +sbwtdcpu none +sbwtdio none"
        - name: RELEASE_TMP
          value: "/tmp"

        # WAMP Connection
        - name: BONDY_URL
          value: "ws://bondy.macula-system.svc.cluster.local:18080/ws"
        - name: BONDY_REALM
          value: "be.cortexiq.energy"

        # Database Connection
        - name: DATABASE_URL
          value: "ecto://cortexiq:cortexiq123@postgres:5432/cortexiq_dashboard"
        - name: BONDY_USERNAME
          valueFrom:
            secretKeyRef:
              name: bondy-credentials
              key: app-username
        - name: BONDY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bondy-credentials
              key: app-password
        - name: POOL_SIZE
          value: "2"

        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "4Gi"
            cpu: "1000m"

        livenessProbe:
          exec:
            command:
            - /app/bin/cortex_iq_projections
            - rpc
            - "1 + 1"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          exec:
            command:
            - /app/bin/cortex_iq_projections
            - rpc
            - "1 + 1"
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

      restartPolicy: Always
