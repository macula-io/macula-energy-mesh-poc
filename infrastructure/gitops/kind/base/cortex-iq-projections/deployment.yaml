apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-iq-projections
  namespace: macula-apps
  labels:
    app: cortex-iq-projections
    component: projections
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cortex-iq-projections
  template:
    metadata:
      labels:
        app: cortex-iq-projections
        component: projections
        tier: backend
    spec:
      containers:
      - name: projections
        image: macula/cortex-iq-projections:latest
        imagePullPolicy: Never  # KinD uses local images
        env:
        # BEAM VM Memory Limits
        - name: ERL_FLAGS
          value: "+MBas aobf +MHas aobf +sbwt none +sbwtdcpu none +sbwtdio none"
        - name: RELEASE_TMP
          value: "/tmp"

        # WAMP Connection
        - name: BONDY_URL
          value: "ws://172.20.0.2:30080/ws"  # NodePort access to Bondy
        - name: BONDY_REALM
          value: "be.cortexiq.energy"

        # Database Connection
        - name: DATABASE_URL
          value: "ecto://cortexiq:cortexiq123@postgres.macula-apps.svc.cluster.local:5432/cortexiq_dashboard"
        - name: POOL_SIZE
          value: "2"

        resources:
          requests:
            memory: "1Gi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

        livenessProbe:
          exec:
            command:
            - /app/bin/cortex_iq_projections
            - rpc
            - "1 + 1"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          exec:
            command:
            - /app/bin/cortex_iq_projections
            - rpc
            - "1 + 1"
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

      restartPolicy: Always
