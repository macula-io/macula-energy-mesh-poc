apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-iq-queries
  namespace: macula-apps
  labels:
    app: cortex-iq-queries
    component: queries
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cortex-iq-queries
  template:
    metadata:
      labels:
        app: cortex-iq-queries
        component: queries
        tier: backend
    spec:
      containers:
      - name: queries
        image: macula/cortex-iq-queries:latest
        imagePullPolicy: Never  # KinD uses local images
        env:
        # BEAM VM Memory Limits
        - name: ERL_FLAGS
          value: "+MBas aobf +MHas aobf +sbwt none +sbwtdcpu none +sbwtdio none"
        - name: RELEASE_TMP
          value: "/tmp"

        # WAMP Connection
        - name: BONDY_URL
          value: "ws://bondy.macula-system.svc.cluster.local:18080/ws"
        - name: BONDY_REALM
          value: "be.cortexiq.energy"

        # Database Connection
        - name: DATABASE_URL
          value: "ecto://cortexiq:cortexiq123@postgres:5432/cortexiq_dashboard"
        - name: POOL_SIZE
          value: "2"

        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "4Gi"
            cpu: "1000m"

        livenessProbe:
          exec:
            command:
            - /app/bin/cortex_iq_queries
            - rpc
            - "1 + 1"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          exec:
            command:
            - /app/bin/cortex_iq_queries
            - rpc
            - "1 + 1"
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

      restartPolicy: Always
