apiVersion: apps/v1
kind: Deployment
metadata:
  name: bondy-edge
  namespace: macula-platform
  labels:
    app: bondy-edge
    app.kubernetes.io/name: bondy
    app.kubernetes.io/component: wamp-router-edge
    app.kubernetes.io/part-of: macula-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bondy-edge
  template:
    metadata:
      labels:
        app: bondy-edge
        app.kubernetes.io/name: bondy
        app.kubernetes.io/component: wamp-router-edge
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: bondy
        image: leapsight/bondy:1.0.0-rc.46
        imagePullPolicy: IfNotPresent
        ports:
        - name: http-ws
          containerPort: 18080
          protocol: TCP
        - name: admin-api
          containerPort: 18081
          protocol: TCP
        env:
        - name: BONDY_ERL_NODENAME
          value: "bondy@127.0.0.1"
        - name: BONDY_ERL_DISTRIBUTED_COOKIE
          value: "bondy"
        - name: BONDY_LOG_CONSOLE
          value: "console"
        - name: BONDY_LOG_LEVEL
          value: "info"
        - name: RELX_REPLACE_OS_VARS
          value: "true"
        volumeMounts:
        - name: config
          mountPath: /bondy/etc/bondy.conf
          subPath: bondy.conf
        - name: data
          mountPath: /bondy/data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: bondy-edge-config
      - name: data
        emptyDir: {}
