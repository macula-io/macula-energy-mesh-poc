apiVersion: apps/v1
kind: Deployment
metadata:
  name: bondy-edge
  namespace: macula-system
  labels:
    app: bondy-edge
    app.kubernetes.io/name: bondy
    app.kubernetes.io/component: wamp-router-edge
    app.kubernetes.io/part-of: macula-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bondy-edge
  template:
    metadata:
      labels:
        app: bondy-edge
        app.kubernetes.io/name: bondy
        app.kubernetes.io/component: wamp-router-edge
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: bondy
        image: leapsight/bondy:1.0.0-rc.46
        imagePullPolicy: IfNotPresent
        ports:
        - name: http-ws
          containerPort: 18080
          protocol: TCP
        - name: admin-api
          containerPort: 18081
          protocol: TCP
        - name: cluster
          containerPort: 18086
          protocol: TCP
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: BONDY_ERL_NODENAME
          value: "bondy@$(POD_IP)"
        - name: BONDY_ERL_DISTRIBUTED_COOKIE
          value: "bondy-cluster-secret"
        - name: BONDY_LOG_CONSOLE
          value: "console"
        - name: BONDY_LOG_LEVEL
          value: "info"
        - name: RELX_REPLACE_OS_VARS
          value: "true"
        - name: ERL_FLAGS
          value: "+MBas aobf +MBacul 0 +MBacnl 0 +MHms 1600 +MHmsbc 64"
        volumeMounts:
        - name: config
          mountPath: /bondy/etc/bondy.conf
          subPath: bondy.conf
        - name: data
          mountPath: /bondy/data
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: config
        configMap:
          name: bondy-edge-config
      - name: data
        emptyDir: {}
