apiVersion: v1
kind: ConfigMap
metadata:
  name: bondy-edge-config
  namespace: macula-system
  labels:
    app: bondy
    app.kubernetes.io/name: bondy
    app.kubernetes.io/component: wamp-router-edge
data:
  bondy.conf: |
    # Bondy Edge Configuration - Connects to Hub via Bridge Relay
    # This node acts as an edge router and bridges to beam-01 hub

    # Security - Allow anonymous for application realms (temporary)
    security.allow_anonymous_user = on
    security.automatically_create_realms = off

    # WAMP over raw TCP (for local applications)
    wamp.tcp.enabled = on
    wamp.tcp.port = 18082
    wamp.tcp.acceptors_pool_size = 20
    wamp.tcp.max_connections = 200

    # API Gateway (includes WebSocket WAMP for local applications)
    api_gateway.http.enabled = on
    api_gateway.http.port = 18080
    api_gateway.http.acceptors_pool_size = 20
    api_gateway.http.max_connections = 200

    # Admin API
    admin_api.http.enabled = on
    admin_api.http.port = 18081

    # Logging
    log.console = console
    log.console.level = info

    # Node name
    nodename = bondy@127.0.0.1
    distributed_cookie = bondy

    # AAE
    aae.enabled = on

    # Store
    store.partitions = 8
    startup.wait_for_store_partitions = on
