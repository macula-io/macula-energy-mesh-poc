apiVersion: batch/v1
kind: Job
metadata:
  name: configure-bondy-edge
  namespace: macula-platform
  labels:
    app: bondy-edge
    job-type: configuration
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: bondy-edge
        job-type: configuration
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-bondy
        image: curlimages/curl:latest
        command:
        - sh
        - -c
        - |
          echo "Waiting for Bondy edge to be ready..."
          until curl -f http://bondy-edge.macula-platform.svc.cluster.local:18081/api; do
            echo "Bondy not ready yet, sleeping 5s..."
            sleep 5
          done
          echo "Bondy edge is ready!"
      containers:
      - name: configure
        image: curlimages/curl:latest
        command:
        - sh
        - -c
        - |
          set -ex

          # Create the CortexIQ realm on edge
          echo "Creating realm be.cortexiq.energy on edge..."
          curl -X POST http://bondy-edge.macula-platform.svc.cluster.local:18081/realms \
            -H "Content-Type: application/json" \
            -d '{
              "uri": "be.cortexiq.energy",
              "description": "CortexIQ Energy Trading Platform Realm (Edge)",
              "authmethods": ["anonymous"],
              "security_enabled": false,
              "allow_anonymous_users": true,
              "is_prototype": false,
              "is_sso_realm": false,
              "allow_connections": true,
              "public_keys": []
            }' || echo "Realm might already exist"

          # Configure Bridge Relay to hub on beam-01
          # This connects the edge realm to the hub realm
          echo "Configuring bridge relay to beam-01..."
          curl -X POST "http://bondy-edge.macula-platform.svc.cluster.local:18081/realms/be.cortexiq.energy/bridge_relays" \
            -H "Content-Type: application/json" \
            -d '{
              "endpoint": "tls://192.168.1.11:30093",
              "realm_uri": "be.cortexiq.energy",
              "transport": {
                "type": "tls",
                "reconnect": {
                  "enabled": true,
                  "max_retries": -1,
                  "backoff_min": 1000,
                  "backoff_max": 60000,
                  "backoff_type": "jitter"
                }
              },
              "topics": [
                {
                  "uri": "be.cortexiq.energy.home.*.*",
                  "match": "prefix",
                  "direction": "out"
                },
                {
                  "uri": "be.cortexiq.energy.utility.*.*",
                  "match": "prefix",
                  "direction": "in"
                },
                {
                  "uri": "be.cortexiq.energy.simulation.time",
                  "match": "exact",
                  "direction": "in"
                }
              ]
            }' || echo "Bridge relay might already be configured"

          echo "Configuration completed!"
