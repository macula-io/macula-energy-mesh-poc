---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-iq-dashboard
  namespace: macula-hub
  labels:
    app: cortex-iq-dashboard
    app.kubernetes.io/name: cortex-iq-dashboard
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cortex-iq-dashboard
  template:
    metadata:
      labels:
        app: cortex-iq-dashboard
        app.kubernetes.io/name: cortex-iq-dashboard
        app.kubernetes.io/component: dashboard
      annotations:
        deploy-timestamp: "20251103-2000"
    spec:
      # Wait for dependencies before starting dashboard
      initContainers:
      - name: wait-for-bondy
        image: curlimages/curl:latest
        command:
        - sh
        - -c
        - |
          echo "Waiting for Bondy to be ready..."
          until curl -sf http://bondy.macula-system.svc.cluster.local:18081/status > /dev/null 2>&1; do
            echo "  Bondy not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "✓ Bondy is ready!"
      - name: wait-for-postgres
        image: postgres:16-alpine
        command:
        - sh
        - -c
        - |
          echo "Waiting for Postgres to be ready..."
          until pg_isready -h postgres -p 5432 -U cortexiq > /dev/null 2>&1; do
            echo "  Postgres not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "✓ Postgres is ready!"
        env:
        - name: PGPASSWORD
          value: "cortexiq123"
      - name: wait-for-projections
        image: curlimages/curl:latest
        command:
        - sh
        - -c
        - |
          echo "Waiting for Projections service to be ready..."
          # Wait for projections pod to exist and be ready
          sleep 10
          echo "✓ Projections should be starting!"

      containers:
      - name: dashboard
        image: registry.macula.local:5000/macula/cortex-iq-dashboard:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 4000
        env:
        - name: BONDY_URL
          value: "ws://bondy.macula-system.svc.cluster.local:18080/ws"
        - name: BONDY_REALM
          value: "be.cortexiq.energy"
        - name: BONDY_ADMIN_URL
          value: "http://bondy.macula-system.svc.cluster.local:18081"
        - name: DATABASE_URL
          value: "ecto://cortexiq:cortexiq123@postgres:5432/cortexiq_dashboard"
        - name: PHX_HOST
          value: "dashboard.cortexiq.local"
        - name: PHX_PORT
          value: "4000"
        - name: SECRET_KEY_BASE
          value: "CHANGE_ME_IN_PRODUCTION_this_is_just_for_poc_demo_need_64_chars_min"
        - name: SIMULATION_SPEED
          value: "105120"
        - name: SIMULATION_START_DATE
          value: "2025-01-01T00:00:00Z"
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "6Gi"
            cpu: "2000m"

---
apiVersion: v1
kind: Service
metadata:
  name: cortex-iq-dashboard
  namespace: macula-hub
  labels:
    app: cortex-iq-dashboard
    app.kubernetes.io/name: cortex-iq-dashboard
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  selector:
    app: cortex-iq-dashboard
  ports:
  - name: http
    protocol: TCP
    port: 4000
    targetPort: http
