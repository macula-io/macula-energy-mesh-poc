---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-iq-dashboard
  namespace: macula-apps
  labels:
    app: cortex-iq-dashboard
    app.kubernetes.io/name: cortex-iq-dashboard
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cortex-iq-dashboard
  template:
    metadata:
      labels:
        app: cortex-iq-dashboard
        app.kubernetes.io/name: cortex-iq-dashboard
        app.kubernetes.io/component: dashboard
    spec:
      initContainers:
      - name: migrate
        image: macula/cortex-iq-dashboard:latest
        imagePullPolicy: Never
        command: ["/app/bin/cortex_iq_dashboard", "eval", "CortexIqDashboard.Release.migrate()"]
        env:
        - name: MACULA_MODE
          value: "edge"
        - name: DATABASE_URL
          value: "ecto://cortexiq:cortexiq123@postgres:5432/cortexiq_dashboard"
        - name: SECRET_KEY_BASE
          value: "CHANGE_ME_IN_PRODUCTION_this_is_just_for_poc_demo_need_64_chars_min"
        - name: PHX_HOST
          value: "dashboard.cortexiq.local"
      containers:
      - name: dashboard
        image: macula/cortex-iq-dashboard:latest
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 4000
        env:
        - name: BONDY_URL
          value: "ws://bondy.macula-platform.svc.cluster.local:18080/ws"
        - name: BONDY_REALM
          value: "be.cortexiq.energy"
        - name: BONDY_ADMIN_URL
          value: "http://bondy.macula-platform.svc.cluster.local:18081"
        - name: DATABASE_URL
          value: "ecto://cortexiq:cortexiq123@postgres:5432/cortexiq_dashboard"
        - name: PHX_HOST
          value: "dashboard.cortexiq.local"
        - name: PHX_PORT
          value: "4000"
        - name: SECRET_KEY_BASE
          value: "CHANGE_ME_IN_PRODUCTION_this_is_just_for_poc_demo_need_64_chars_min"
        - name: SIMULATION_SPEED
          value: "105120"
        - name: SIMULATION_START_DATE
          value: "2025-01-01T00:00:00Z"
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "6Gi"
            cpu: "2000m"

---
apiVersion: v1
kind: Service
metadata:
  name: cortex-iq-dashboard
  namespace: macula-apps
  labels:
    app: cortex-iq-dashboard
    app.kubernetes.io/name: cortex-iq-dashboard
    app.kubernetes.io/component: dashboard
spec:
  type: NodePort
  selector:
    app: cortex-iq-dashboard
  ports:
  - name: http
    protocol: TCP
    port: 4000
    targetPort: http
    nodePort: 30000
