---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cortex-iq-dashboard
  namespace: macula-apps
  labels:
    app: cortex-iq-dashboard
    app.kubernetes.io/name: cortex-iq-dashboard
    app.kubernetes.io/component: dashboard
  annotations:
    nginx.ingress.kubernetes.io/websocket-services: "cortex-iq-dashboard"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Required for Phoenix LiveView WebSocket connections
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
spec:
  ingressClassName: nginx
  rules:
    - host: dashboard.cortexiq.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cortex-iq-dashboard
                port:
                  number: 4000
