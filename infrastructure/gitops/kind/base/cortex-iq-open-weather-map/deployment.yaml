apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-iq-open-weather-map
  namespace: macula-edge
  labels:
    app: cortex-iq-open-weather-map
    component: adapter
    tier: integration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cortex-iq-open-weather-map
  template:
    metadata:
      labels:
        app: cortex-iq-open-weather-map
        component: adapter
        tier: integration
    spec:
      containers:
      - name: weather
        image: macula/cortex-iq-open-weather-map:latest
        imagePullPolicy: Never  # KinD uses local images
        env:
        # BEAM VM Memory Limits
        - name: ERL_FLAGS
          value: "+MBas aobf +MHas aobf +sbwt none +sbwtdcpu none +sbwtdio none"
        - name: RELEASE_TMP
          value: "/tmp"

        # WAMP Connection
        - name: BONDY_URL
          value: "ws://bondy.macula-system.svc.cluster.local:18080/ws"
        - name: BONDY_REALM
          value: "be.cortexiq.energy"

        # OpenWeatherMap API Configuration
        - name: OPENWEATHERMAP_API_KEY
          valueFrom:
            secretKeyRef:
              name: cortex-iq-openweathermap-secrets
              key: api-key
              optional: true
        - name: OPENWEATHERMAP_API_URL
          value: "https://api.openweathermap.org/data/2.5"
        - name: POLL_INTERVAL_MS
          value: "300000"  # Poll every 5 minutes
        # Brussels, Belgium coordinates (Flanders region)
        - name: LATITUDE
          value: "50.8503"
        - name: LONGITUDE
          value: "4.3517"

        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        livenessProbe:
          exec:
            command:
            - /app/bin/cortex_iq_open_weather_map
            - rpc
            - "1 + 1"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          exec:
            command:
            - /app/bin/cortex_iq_open_weather_map
            - rpc
            - "1 + 1"
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

      restartPolicy: Always
