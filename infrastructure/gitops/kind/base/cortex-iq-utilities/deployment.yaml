apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-iq-utilities
  namespace: macula-edge
  labels:
    app: cortex-iq-utilities
    component: simulation
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cortex-iq-utilities
  template:
    metadata:
      labels:
        app: cortex-iq-utilities
        component: simulation
        tier: backend
    spec:
      containers:
      - name: utilities
        image: registry.macula.local:5000/macula/cortex-iq-utilities:latest
        imagePullPolicy: Always
        env:
        - name: ERL_FLAGS
          value: "+MBas aobf +MHas aobf +sbwt none +sbwtdcpu none +sbwtdio none +MIscs 5120"
        - name: RELEASE_TMP
          value: "/tmp"
        - name: BONDY_URL
          value: "ws://172.20.0.2:30080/ws"
        - name: BONDY_REALM
          value: "be.cortexiq.energy"
        - name: NUM_PROVIDERS
          value: "5"
        - name: PROVIDER_ID_OFFSET
          value: "0"
        resources:
          requests:
            memory: "2Gi"
            cpu: "200m"
          limits:
            memory: "6Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - /app/bin/cortex_iq_utilities
            - rpc
            - "1 + 1"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /app/bin/cortex_iq_utilities
            - rpc
            - "1 + 1"
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      restartPolicy: Always
