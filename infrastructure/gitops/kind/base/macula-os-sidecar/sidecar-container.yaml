# MaculaOs Sidecar Container Definition
# This is a reusable container spec that gets added to payload deployments
# via Kustomize patches

- name: macula-os
  image: macula/macula-os:latest
  imagePullPolicy: Never  # Image loaded into KinD
  ports:
  - containerPort: 8080
    name: wamp-proxy
    protocol: TCP
  env:
  # Proxy configuration
  - name: MACULA_PORT
    value: "8080"

  # Upstream Bondy connection
  - name: BONDY_URL
    value: "ws://172.20.0.2:30080/ws"

  - name: BONDY_REALM
    value: "be.cortexiq.energy"

  # API key will be overridden per deployment
  # Each deployment provides its own secretRef
  - name: MACULA_API_KEY
    valueFrom:
      secretKeyRef:
        name: OVERRIDE_ME  # Must be overridden in deployment
        key: key

  # Resource limits
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  # Liveness probe - check if proxy server is responding
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 3
    failureThreshold: 3

  # Readiness probe - check if upstream is connected
  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
