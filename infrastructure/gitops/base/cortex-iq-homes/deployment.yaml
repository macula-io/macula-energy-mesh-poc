apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-iq-homes
  namespace: macula-system
  labels:
    app: cortex-iq-homes
    app.kubernetes.io/name: cortex-iq-homes
    app.kubernetes.io/component: payload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cortex-iq-homes
  template:
    metadata:
      labels:
        app: cortex-iq-homes
    spec:
      containers:
      - name: cortex-iq-homes
        image: macula/cortex-iq-homes:latest
        imagePullPolicy: Always
        env:
        - name: MACULA_MODE
          value: "edge"
        - name: REALM_URI
          value: "be.cortexiq.energy"
        - name: BONDY_WS_URL
          value: "ws://192.168.100.10:18080/ws"
        - name: NUM_HOMES
          value: "13"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
