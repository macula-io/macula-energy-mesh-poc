apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ExternalDNS overlay for beam-00 cluster
# Physical k3s cluster for beam applications

namespace: external-dns

resources:
  - ../../../../kind/base/external-dns

# Secret containing PowerDNS API key
# Created manually via: kubectl create secret generic external-dns-pdns --from-literal=api-key=YOUR_KEY

# Patches to customize for beam-00 cluster
patches:
  - target:
      kind: Deployment
      name: external-dns
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/3
        value: --pdns-server=http://192.168.129.9:8081
      - op: replace
        path: /spec/template/spec/containers/0/args/4
        value: --domain-filter=beam.local
      - op: replace
        path: /spec/template/spec/containers/0/args/7
        value: --txt-owner-id=beam-00
