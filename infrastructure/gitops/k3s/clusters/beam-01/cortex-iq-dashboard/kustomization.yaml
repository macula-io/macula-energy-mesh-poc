apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../kind/base/cortex-iq-dashboard

namespace: macula-hub

# Patch Bondy URL to point to beam-01 local service
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "ws://bondy.macula-platform.svc.cluster.local:18080/ws"
    target:
      kind: Deployment
      name: cortex-iq-dashboard
