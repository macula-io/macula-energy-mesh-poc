apiVersion: v1
kind: Service
metadata:
  name: bondy
  namespace: macula-platform
  labels:
    app: bondy
    app.kubernetes.io/name: bondy
    app.kubernetes.io/component: wamp-router
spec:
  type: NodePort
  selector:
    app: bondy
  ports:
  - name: http-ws
    port: 18080
    targetPort: 18080
    nodePort: 30080
    protocol: TCP
  - name: admin-api
    port: 18081
    targetPort: 18081
    nodePort: 30081
    protocol: TCP
  - name: https-wss
    port: 18083
    targetPort: 18083
    nodePort: 30083
    protocol: TCP
  - name: bridge-relay
    port: 18093
    targetPort: 18093
    nodePort: 30093
    protocol: TCP
