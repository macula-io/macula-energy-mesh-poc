apiVersion: v1
kind: ConfigMap
metadata:
  name: bondy-config
  namespace: macula-platform
  labels:
    app: bondy
    app.kubernetes.io/name: bondy
    app.kubernetes.io/component: wamp-router
data:
  bondy.conf: |
    # Bondy Hub Configuration for beam-01 with Bridge Relay
    # This node acts as the authoritative realm hub

    # Security - Allow anonymous for application realms (temporary)
    security.allow_anonymous_user = on
    security.automatically_create_realms = off

    # WAMP over raw TCP
    wamp.tcp.enabled = on
    wamp.tcp.port = 18082
    wamp.tcp.acceptors_pool_size = 200
    wamp.tcp.max_connections = 100000

    # API Gateway (includes WebSocket WAMP for local applications)
    api_gateway.http.enabled = on
    api_gateway.http.port = 18080
    api_gateway.http.acceptors_pool_size = 200
    api_gateway.http.max_connections = 500000

    # Admin API
    admin_api.http.enabled = on
    admin_api.http.port = 18081

    # Bridge Relay Listener - TLS listener for edge clusters to connect
    bridge_relay.tls.enabled = on
    bridge_relay.tls.port = 18093
    bridge_relay.tls.acceptors_pool_size = 100
    bridge_relay.tls.max_connections = 10000
    # Self-signed cert for demo (production should use proper certs)
    bridge_relay.tls.certfile = /bondy/etc/certs/server.crt
    bridge_relay.tls.keyfile = /bondy/etc/certs/server.key

    # Logging
    log.console = console
    log.console.level = info

    # Node name
    nodename = bondy@127.0.0.1
    distributed_cookie = bondy

    # AAE
    aae.enabled = on

    # Store
    store.partitions = 16
    startup.wait_for_store_partitions = on
