apiVersion: batch/v1
kind: Job
metadata:
  name: create-realm-cortexiq
  namespace: macula-platform
  labels:
    app: bondy
    job-type: realm-creation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: bondy
        job-type: realm-creation
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-bondy
        image: curlimages/curl:latest
        command:
        - sh
        - -c
        - |
          echo "Waiting for Bondy to be ready..."
          until curl -f http://bondy.macula-platform.svc.cluster.local:18081/api; do
            echo "Bondy not ready yet, sleeping 5s..."
            sleep 5
          done
          echo "Bondy is ready!"
      containers:
      - name: create-realm
        image: curlimages/curl:latest
        command:
        - sh
        - -c
        - |
          set -ex

          # Create the CortexIQ realm
          echo "Creating realm be.cortexiq.energy..."
          curl -X POST http://bondy.macula-platform.svc.cluster.local:18081/realms \
            -H "Content-Type: application/json" \
            -d '{
              "uri": "be.cortexiq.energy",
              "description": "CortexIQ Energy Trading Platform Realm",
              "authmethods": ["anonymous", "cryptosign"],
              "is_prototype": false,
              "is_sso_realm": false,
              "allow_connections": true,
              "public_keys": []
            }' || echo "Realm might already exist"

          echo "Realm creation completed!"
