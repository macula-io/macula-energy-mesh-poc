apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# beam-01 - Hub cluster on BEAM hardware
# This cluster runs:
# - Bondy Hub with Bridge Relay enabled (realm: be.cortexiq.energy)
# - CortexIQ Dashboard (Phoenix LiveView UI)
# - CortexIQ Projections (CQRS write-side)
# - CortexIQ Queries (CQRS read-side)
# - PostgreSQL/TimescaleDB (storage)

resources:
  - bondy                      # Bondy hub with bridge relay on port 30093
  - postgres                   # PostgreSQL/TimescaleDB for hub storage
  - cortex-iq-dashboard        # Dashboard UI
  - cortex-iq-projections      # CQRS projections
  - cortex-iq-queries          # CQRS queries
  - external-dns               # DNS management

labels:
  - pairs:
      cluster: beam-01
      cluster-type: k3s-hub
      app.kubernetes.io/managed-by: gitops
